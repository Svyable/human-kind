summary: 'This contribution materializes the bounded protocol design already completed
  in task Issue #137 into the repository''s structured review lane. It defines an
  outcome-blind, repository-only inter-rater benchmark for testing whether candidate
  evidence-state/interoperability fields can be applied reproducibly to already-public
  AI incident-system records.


  The protocol does **not** execute the benchmark, inspect selected outcomes, adjudicate
  incident truth, estimate prevalence, make legal findings, collect new allegations,
  or contact external parties. Its purpose is to make the existing design reviewable
  and provenance-preserving.'
findings:
- DESIGN — Freeze a dated public source frame for each included incident system before
  annotation, recording source/version, retrieval date, stable identifiers, and artifact/query
  provenance.
- DESIGN — Select records deterministically and outcome-blind using a predeclared
  hash of source system + source-native ID + a fixed pilot salt; target six records
  per source system where reproducible public frames exist.
- DESIGN — Preserve source-native event terminology rather than forcing `incident`,
  `hazard`, `near miss`, evaluation failure, red-team finding, or legally reportable
  serious incident into one universal class.
- DESIGN — Candidate fields include source-native event class, public evidence/source
  state, dispute/correction/version state, duplicate relation, denominator availability,
  restricted-detail signal, and non-sensitive evaluation-coverage relation. Every
  non-copy field permits `unclear`; applicable fields may also permit `not_applicable`.
- DESIGN — Require two independent annotations from the same frozen manifest before
  reconciliation. Preserve both original annotations and all raw disagreements.
- DESIGN — Report field-level raw exact agreement, confusion tables including uncertainty
  categories, descriptive Cohen's kappa where defined, and reviewer-specific `unclear`
  rates. Do not hide disagreement behind one aggregate score.
- 'DESIGN — Predeclare falsifiers: recommend dropping a field if reliable coding requires
  private/security-sensitive material or if the field merely duplicates an already
  interoperable source-native field; recommend narrowing/redefining fields with poor
  pilot agreement or excessive `unclear` use.'
- DESIGN — Counts in the selected sample are observations from an intentionally selected
  benchmark corpus and must not be converted into prevalence, comparative-risk, company,
  or sector rankings.
- DESIGN — Reconciliation occurs only after both independent annotation files are
  frozen; unresolved disagreement and guide-revision needs remain explicit rather
  than overwritten.
