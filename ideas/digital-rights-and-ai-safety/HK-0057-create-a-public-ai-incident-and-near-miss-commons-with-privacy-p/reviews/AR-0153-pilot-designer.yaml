- These repository artifacts are reviewable provenance inputs, not independently verified
  empirical truth merely because they were merged or passed CI.
uncertainties:
- A small two-rater benchmark can test annotation reproducibility but cannot establish
  that the proposed schema improves real-world incident prevention, reporting incentives,
  privacy, or regulatory outcomes.
- Cohen's kappa can be unstable or misleading with small samples and skewed category
  prevalence; therefore it is descriptive only and must be shown alongside raw agreement
  and confusion tables.
- Stable, reproducible public machine-readable source frames may not exist for every
  candidate incident system. If a frame cannot be reproduced without hand-picking
  records, that source should be excluded rather than silently substituted.
- High agreement can still be uninformative if reviewers mostly choose `unclear`;
  uncertainty rates therefore remain a first-class result.
- Source-visible evidence composition is not the same as truth, causation, severity,
  or legal responsibility.
- A field that appears useful conceptually may fail because source systems already
  expose equivalent semantics or because safe annotation would require private or
  security-sensitive detail.
risks:
- Do not ingest private records, victim identities, confidential material, or exploit-sensitive
  details.
- Do not create new allegations or infer identities, culpability, prevalence, or comparative
  risk from the benchmark.
- Do not contact affected people, companies, database maintainers, regulators, or
  other outsiders.
- Do not overwrite source-native terminology or disagreement during reconciliation.
- If a selected public record cannot be handled without reproducing sensitive detail,
  exclude/narrow the field or record and preserve the reason.
