uncertainties:
- The OECD common framework and AIM are evolving; the public documents reviewed here
  may not expose every field, API, governance rule, correction process, or planned
  submission capability.
- AIID supports multiple taxonomies by design, so absence of one semantic in a reviewed
  taxonomy does not establish absence from AIID as a whole or from a contributed taxonomy
  not reviewed in depth.
- NIST AI RMF 1.0 is currently being revised. Its Playbook provides voluntary risk-management
  practices rather than a mandatory incident-data schema, so mapping NIST fields directly
  to registry fields requires care.
- The reviewed public materials do not establish whether OECD AIM and AIID already
  maintain internal or forthcoming restricted-detail/privacy tiers, dispute states,
  or cross-database identifiers not visible in their public documentation.
- “Near-miss” and OECD “hazard” overlap but are not necessarily identical concepts;
  collapsing them without a formal semantic crosswalk could erase useful distinctions.
- Media-derived systems have selection and coverage biases; interoperable schemas
  cannot make incident counts representative of prevalence.
- No claim is made here that OECD, AIID, or NIST records are themselves verified ground
  truth. The crosswalk concerns documented schemas, governance semantics, and public
  methods, not the truth of individual incident allegations.
risks:
- A new public incident database would duplicate existing infrastructure, fragment
  identifiers, increase moderation burden, and create another surface for allegations,
  privacy harms and exploit-sensitive disclosure.
- A forced universal taxonomy could erase legitimate disagreement among harm models,
  legal regimes and affected communities; interoperability should preserve source
  vocabularies and provenance rather than normalize them away.
- Evidence-grade labels can create false confidence if they are treated as adjudications
  of disputed allegations rather than transparent descriptions of available evidence
  and review state.
- Cross-system deduplication can accidentally join records about different events
  or people; any future test should use already-public records and reversible mappings
  only.
- Linking incident classes to evaluations could expose security-sensitive test gaps
  if implemented incautiously; the first step should remain a public-schema mapping,
  not publication of exploitable weaknesses.
- This review uses public documentation only. It does not contact affected people,
  companies, maintainers, regulators or other external organizations, and it does
  not add allegations or personal data.
recommended_status: needs-scope
next_action: 'Do not build a new incident repository. Produce a versioned, source-backed
  crosswalk table for OECD common-reporting criteria, OECD AIM fields/methods, AIID
  core/report fields plus its CSET/GMF taxonomy fields, and NIST AI RMF Manage/Measure
  incident-monitoring concepts. Limit the candidate extension to four questions: (1)
  is there a portable evidence/corroboration-state vocabulary; (2) are correction/dispute/version
  semantics interoperable; (3) is there a public restricted-detail/privacy-tier semantic;
  and (4) is there an explicit, non-sensitive relation from incident class to evaluation
  coverage? For every proposed field, require a source and mark already covered, partially
  covered, meaningfully absent, or unclear. If all four are adequately covered, recommend
  shelving the standalone HK-0057 commons concept for human consideration. Use public
  documentation and public sample metadata only; do not ingest allegations, personal
  data, exploit details, or create a production database.'
