uncertainties:
- 'Incident databases can still be highly useful without population representativeness:
  they can surface recurring failure mechanisms, generate hypotheses, support case-based
  learning, and provide evaluation targets. Denominator blindness is a limit on prevalence
  inference, not a reason to discard incident records.'
- OECD's common reporting framework and AIM continue to evolve, and an open submission
  process is being developed. Public documentation reviewed here may lag fields, APIs,
  dispute workflows, or privacy controls that reduce HK-0057's residual gap.
- Mandatory reporting regimes such as the EU AI Act can improve ascertainment for
  covered systems and events, but coverage is jurisdiction-, system-, and severity-specific.
  They do not create a universal denominator for all AI use.
- “Near miss,” “hazard,” evaluation failure, red-team finding, and deployed incident
  are not demonstrably interchangeable. A future crosswalk may show that some pairings
  cannot be represented as one-to-one mappings.
- Evidence-state labels can create false confidence and poor inter-rater reliability
  if definitions are vague. A schema should be rejected or narrowed if independent
  reviewers cannot apply it consistently to the same public records.
- Regulator or court findings can later be revised, appealed, scoped narrowly, or
  address legal rather than technical causation. Such findings should be provenance-bearing
  evidence states, not an irreversible universal truth flag.
- The reviewed public sources do not establish a complete model for victim consent,
  defamation law, trade secrets, security-sensitive disclosure, or cross-jurisdiction
  privacy obligations. This review makes no legal conclusion.
risks:
- Treating report volume as prevalence could misdirect research, regulation, or public
  concern toward systems and organizations that are merely more observable.
- Treating an allegation or media report as a verified incident can create reputational
  harm and contaminate later analyses.
- Overly detailed public records can expose affected people, confidential data, security
  weaknesses, or reproducible abuse paths.
- Aggressive deduplication can merge distinct events; weak deduplication can inflate
  apparent recurrence. Merge/split history should therefore be reversible and provenance-preserving.
- A single universal taxonomy could erase jurisdictional, cultural, legal, or domain-specific
  distinctions. Preserve source vocabularies and explicit mappings.
- Linking incidents to evaluation gaps is useful, but publishing exact exploit or
  test-gap details may increase misuse risk. Start with non-sensitive class-level
  mappings only.
- This review uses public documentation only and does not add private incident records,
  allegations about new parties, personal data, or exploit instructions.
