summary: 'HK-0057 has a useful residual case, but not as a source of incident prevalence
  and probably not as another standalone public incident database. OECD AIM and the
  AI Incident Database both explicitly describe important selection processes: AIM
  is built from publicly reported news and acknowledges that it captures only a subset
  of worldwide incidents and hazards, while AIID describes itself as representative
  of public incidents rather than all incidents. That makes raw report counts a discovery
  signal, not a denominator-adjusted risk rate. The strongest remaining contribution
  is a narrow interoperability layer that preserves source vocabulary, evidence/corroboration
  state, disputes/corrections, duplicate clustering, and restricted-detail handling,
  and that connects incident classes to evaluation coverage without publishing sensitive
  exploit detail. Near-miss semantics must remain source-qualified: OECD distinguishes
  incidents (actual harm) from hazards (potential harm), NIST explicitly tracks near-misses,
  and the EU AI Act uses a legally narrower serious-incident reporting threshold.
  These categories should be crosswalked rather than silently collapsed.'
findings:
- SOURCED — OECD AIM states that its incidents and hazards come from reputable international
  news sources and that these records represent only a subset of all AI incidents
  and hazards worldwide. OECD also states that it does not independently verify the
  accuracy, completeness, or validity of third-party information in AIM. Therefore
  AIM counts are not a census of underlying AI failures.
- SOURCED — AIID's published collection methodology says the database is built from
  incidents that gained enough notoriety to appear in popular or research press and
  should be treated as representative of public incidents, not all incidents known
  across the AI industry. Its own taxonomy launch documentation identifies geographic
  and company-selection biases.
- INFERENCE — Incident-count trends cannot responsibly be interpreted as prevalence,
  failure probability, or cross-company/sector risk rates without an exposure denominator
  and a model of reporting/detection. Counts can rise because deployments, media attention,
  submission pathways, search coverage, or editorial rules change.
- SOURCED — OECD AIM itself illustrates denominator sensitivity by noting that AI
  incidents may receive more media attention while constituting a smaller share of
  all AI news. That is useful context but still not a deployment or user-exposure
  denominator.
- SOURCED — OECD defines an AI incident as actual harm and an AI hazard as a potentially
  harmful event or circumstance. NIST AI RMF Manage guidance separately calls for
  monitoring and sharing errors, near-misses, incidents, and negative impacts. These
  categories overlap but are not established as synonymous.
- SOURCED — The EU AI Act's Article 73 requires providers of high-risk systems to
  report serious incidents after establishing a causal link or reasonable likelihood
  of one, with severity-dependent deadlines. This is a legal reporting threshold,
  not a general ontology for every public hazard or near miss.
- INFERENCE — HK-0057 should preserve the source system's original category and add
  explicit crosswalk relationships rather than normalize every event into one universal
  incident/near-miss label.
- SOURCED — OECD's common reporting framework provides 29 criteria, including supporting
  materials, system relationship to the event, severity and harm type. This substantially
  reduces the case for inventing another base incident schema.
- SOURCED — AIID supports multiple reports and multiple taxonomies rather than one
  canonical truth, and its GMF annotations include confidence modifiers and supporting
  text. Its CSET taxonomy uses independent annotation, peer review, and quality control
  while explicitly acknowledging that mistakes can occur.
- INFERENCE — Evidence state should be distinct from event type. A practical record
  needs separate fields for what is being claimed, what public sources support it,
  whether sources are independent, whether a regulator/court/first-party investigation
  has made a finding, whether the record is disputed, and what remains unknown. A
  label such as “incident” must not itself imply adjudicated causation.
- SOURCED — NIST Manage guidance recommends maintaining records of errors, near-misses,
  incidents and negative impacts, along with report dates, number of reports, impact/severity
  assessment, responses, system changes and version history. NIST also recommends
  sharing information with incident databases and relevant stakeholders.
- INFERENCE — Correction/version provenance is therefore not bookkeeping overhead;
  it is part of the evidence object. HK-0057 should keep prior claims, corrections,
  dispute reasons, duplicate merges/splits, and source-history visible rather than
  overwrite them with a final narrative.
- SOURCED — NIST's guidance is voluntary and OECD AIM is a beta public-source monitor.
  Neither should be treated as an adjudicator of individual allegations or as evidence
  that public disclosure is always appropriate.
- INFERENCE — Public transparency and evidence completeness can conflict. Supporting
  evidence may contain victim identities, confidential business data, or exploit-relevant
  details. A commons should allow a public minimal record to point to the existence/provenance
  of restricted evidence without requiring publication of the restricted material
  itself.
- 'INFERENCE — The strongest remaining HK-0057 value proposition is therefore an interoperability
  and epistemic-state profile over existing systems: source-native event category;
  evidence/source state; denominator warning; dispute/correction/version history;
  duplicate-cluster identity; restricted-detail marker; and a non-sensitive relation
  from incident class to evaluation coverage.'
