summary: 'HK-0055 combines two claims that should not be treated as one: (1) earlier
  cash can improve welfare relative to substantially delayed assistance in some flood
  settings, and (2) a forecast threshold, financing rule, targeting system, and delivery
  rail can reliably trigger anticipatory cash with acceptable false-alarm, miss, lead-time,
  distributional, and opportunity-cost tradeoffs. The first claim has credible randomized
  evidence from Bangladesh and Nepal. The second remains substantially more context-dependent.
  The reviewed RCT documentation randomizes transfer timing after flood forecasts
  meet WFP country-office criteria and within pre-existing beneficiary/delivery systems;
  it does not randomize candidate forecast thresholds or estimate the generic precision,
  recall, false-alarm cost, miss harm, or portability of a trigger architecture. Existing
  humanitarian trigger practice already uses historical hindcasts, explicit thresholds,
  pre-arranged financing, and pre-agreed actions, and public OCHA examples show material
  lead-time/reliability limitations and actual missed activations. Recommendation:
  `needs-evidence` for human consideration, with any next work restricted to a predeclared
  retrospective validation protocol using public or synthetic data.'
findings:
- SOURCED — The World Bank reproducibility package for *Fast Action for Floods* describes
  a randomized controlled trial in Bangladesh and Nepal testing cash delivered within
  days of a flood versus the same assistance months later; it reports overall gains
  in food security and psychosocial well-being from timely cash. Computational reproducibility
  was verified by the World Bank Development Impact analytics team.
- SOURCED — The Bangladesh 2024 microdata documentation states that the study randomized
  the timing of electronic transfers across three arms after forecast intensity met
  criteria set by WFP's country office. Transfers used bKash. The beneficiary list
  contained almost 90,000 people, and the phone-survey sample was drawn from beneficiary
  households whose active phone numbers were linked to their bKash accounts.
- SOURCED — The Nepal 2022-2023 microdata documentation likewise states that the study
  randomized timing of physical cash transfers after forecast intensity met WFP country-office
  criteria, using a pre-existing list of potential beneficiaries and local remittance
  agents.
- INFERENCE — These trials provide direct evidence about the welfare value of *timing
  conditional on activation and delivery infrastructure*. They do not identify whether
  a different forecast probability, hazard threshold, readiness/action split, financing
  rule, beneficiary-selection rule, or delivery rail would have produced better or
  worse trigger performance.
- SOURCED — OCHA's Bangladesh trigger work historically evaluated flood models back
  to 1987, compared forecasts with observed events and false alarms, estimated activation
  thresholds, and evaluated the two-model readiness/activation system both independently
  and jointly before thresholds were revised.
- SOURCED — OCHA's Nepal flood trigger uses explicit readiness/action thresholds and
  reports an inverse relationship between warning lead time and forecast reliability.
  Historical analysis examined false alarms, missed activations, and performance by
  lead time; at Chisapani, the historical forecast had never reached the relevant
  exceedance threshold at 4-7 days lead time in the analysis described.
- SOURCED — OCHA's Philippines typhoon trigger work reports that Typhoon Rai intensified
  so rapidly that the forecast did not predict the scale of damage until too late
  and the trigger threshold was not reached. Its peer review explicitly identified
  false negatives and called for better threshold rationale, versioning, data provenance,
  and continued model review.
- INFERENCE — Trigger validation therefore needs event-by-event hindcasts with predeclared
  thresholds and a confusion matrix (hits, false alarms, misses, correct rejections)
  plus lead-time and decision-cost analysis. Demonstrating that early cash can help
  after a correctly anticipated flood is insufficient evidence that a proposed trigger
  will activate reliably or at the right cost.
- 'INFERENCE — HK-0055 is not novel simply because it links forecasts to pre-committed
  cash: mature anticipatory-action frameworks already combine predictive models or
  forecasts, pre-arranged financing, and pre-agreed actions. A distinct contribution
  would have to be a better, reproducible validation protocol or evidence layer rather
  than another generic trigger architecture.'
- INFERENCE — Any transfer claim must preserve the dependency on beneficiary identification
  and payment rails. The Bangladesh evidence is especially conditioned on a validated
  beneficiary list and bKash-linked phone/account access; this does not establish
  equal reach among people absent from administrative lists, without functional accounts/phones,
  or in settings with weaker payment and market infrastructure.
