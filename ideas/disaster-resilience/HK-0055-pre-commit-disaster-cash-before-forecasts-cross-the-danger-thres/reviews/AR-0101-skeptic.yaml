uncertainties:
- The randomized Bangladesh/Nepal evidence is meaningful positive evidence for the
  timing mechanism; trigger-architecture uncertainty should not be misrepresented
  as evidence that anticipatory cash itself is ineffective.
- The public documentation reviewed here is not an exhaustive reconstruction of every
  forecast vintage, operational decision, beneficiary-selection process, payment failure,
  market condition, or humanitarian outcome across all anticipatory-action frameworks.
- Historical hindcasts can themselves overfit if event definitions, forecast products,
  model versions, thresholds, lead times, loss functions, or evaluation windows are
  chosen after inspecting outcomes. A retrospective test is credible only if those
  choices are predeclared or evaluated transparently across a bounded grid without
  selecting only the best-performing configuration.
- Forecast skill is not equivalent to humanitarian value. A technically accurate trigger
  can still fail if payment rails, beneficiary lists, markets, communications, staffing,
  or local access fail; conversely, acting on an imperfect forecast can still have
  positive expected value when the cost of acting in vain is low relative to the cost
  of a miss.
- The Bangladesh bKash and Nepal remittance-agent delivery contexts are not evidence
  that the same delivery speed, inclusion, or welfare effects transfer to populations
  without accounts, active phones, administrative visibility, functioning markets,
  safe access, or comparable local institutions.
- The reviewed RCT design compares earlier with later assistance; it does not by itself
  establish superiority over a well-prepared rapid post-shock transfer system in every
  setting.
- Public historical data may be sufficient to score forecast trigger performance but
  insufficient to estimate distributional miss harms, household-level opportunity
  costs, market effects, or delivery failures. Those missing outcomes should remain
  missing rather than be imputed as success.
risks:
- Post-hoc threshold tuning can create false confidence by selecting the trigger that
  happens to fit a small historical event set.
- False alarms can consume scarce pre-arranged funds, create acting-in-vain costs,
  strain payment systems, or distort markets; misses can create false reassurance
  and systematically exclude communities whose hazards are harder to forecast.
- Longer lead time can trade off against forecast reliability, so optimizing only
  for earliest action can worsen missed or false activations.
- Administrative beneficiary lists and digital payment rails can systematically omit
  people without formal IDs, accounts, stable phones, connectivity, housing, or prior
  program visibility.
- Average welfare gains among reached beneficiaries can conceal distributional failures
  among people who were not eligible, not listed, unreachable, or unable to transact.
- 'A trigger metric can become a Goodhart target: implementers may optimize measured
  forecast performance or activation compliance while ignoring last-mile delivery,
  market functioning, complaints, or welfare harm.'
- No result in this review authorizes a live trigger, movement of funds, creation
  of recipient lists, targeting decisions, outreach to communities or humanitarian
  organizations, or operational deployment.
recommended_status: needs-evidence
next_action: 'Create a repository-only retrospective validation specification for
  one already-public flood context, not a live trigger. Before looking at results,
  record: hazard and geography; forecast source and exact model/version where available;
  observation used to define the event; a small bounded grid of candidate readiness/action
  thresholds; lead times; event window; hits, false alarms, misses, and correct rejections;
  maximum pre-arranged activation cost or a clearly labeled proxy; the welfare/loss
  assumption assigned to a miss; observed or documented delivery latency; beneficiary-eligibility
  and payment-access coverage; known market/delivery constraints; and a realistic
  comparator such as rapid post-shock assistance. Report every tested threshold rather
  than only the best one. If public data cannot support a field—especially distributional
  reach, delivery failure, or welfare cost—mark it unavailable and stop short of claiming
  validation. Use only public or synthetic data. Do not create recipient lists, move
  money, contact external organizations or communities, recommend an operational threshold,
  or deploy anything.'
