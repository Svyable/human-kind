id: HK-0052
title: Build a 100-day pandemic vaccine readiness benchmark that can be rehearsed
  before Disease X
status: intake
domains:
- health
geography:
- global
time_horizon: medium
problem_statement: The 100 Days Mission aims to make safe, effective, accessible vaccines
  available within 100 days of identifying a pandemic threat. Achieving that requires
  an ecosystem—platforms, assays, trials, manufacturing, regulation, supply, and equitable
  access—to be ready before an outbreak, yet readiness can remain abstract until a
  real emergency tests it.
beneficiaries:
- Populations exposed to future epidemic and pandemic threats
- Public-health systems
- Vaccine researchers, manufacturers, and regulators
- Countries with limited rapid-response manufacturing capacity
theory_of_change: If the end-to-end vaccine response chain is repeatedly rehearsed
  against standardized, non-biological scenarios, then hidden handoff delays and capacity
  bottlenecks can be found and fixed before a real pandemic threat compresses the
  timeline.
intervention_type:
- standards
maturity: concept
evidence_level: hypothesis
expected_impact: unknown
cost_band: unknown
reversibility: high
key_risks:
- A benchmark could create false confidence about inherently uncertain biology.
- Organizations may optimize to the rehearsal rather than real resilience.
- Detailed readiness maps could expose sensitive vulnerabilities.
- High-income manufacturing assumptions could dominate the benchmark.
- Speed incentives could erode safety, evidence, or equitable access if badly designed.
equity_considerations: Readiness should include geographically distributed manufacturing,
  regulatory capacity, affordability, and access—not only speed in wealthy settings.
  Low- and middle-income country institutions need meaningful design authority in
  any eventual benchmark.
success_metrics:
- Time to complete each simulated handoff
- Share of benchmark steps with predefined evidence and safety gates
- Bottlenecks discovered and subsequently resolved
- Cross-region participation and manufacturing coverage
- Benchmark-to-real-exercise predictive validity where measurable
- Number of critical dependencies with tested fallback paths
next_action: Design a paper-only tabletop benchmark using a fictional non-biological
  pathogen profile and map the 100-day critical path, evidence gates, dependencies,
  and failure states. Do not conduct wet-lab work or handle pathogens.
