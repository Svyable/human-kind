id: HK-0060
title: Build an environmental AMR sentinel network before resistance becomes a clinical
  surprise
status: intake
domains:
- health
geography:
- global
- with emphasis on sentinel sites spanning human
- animal
- and environmental interfaces
time_horizon: long
problem_statement: Antimicrobial resistance is often recognized through clinical surveillance
  after resistant organisms are already affecting patients. WHO now provides specific
  guidance for wastewater and environmental surveillance of AMR, creating an opportunity
  to test whether environmental signals can complement clinical and One Health systems
  without being overinterpreted.
beneficiaries:
- Patients threatened by antimicrobial resistance
- Health systems
- Communities near high-antibiotic-use or contaminated environments
- Public-health and One Health surveillance programs
theory_of_change: If environmental AMR signals are collected consistently and interpreted
  alongside clinical and One Health data, emerging resistance patterns may be detected
  earlier or mapped more comprehensively, enabling targeted investigation before they
  become larger clinical surprises.
intervention_type:
- research
maturity: concept
evidence_level: hypothesis
expected_impact: unknown
cost_band: unknown
reversibility: high
key_risks:
- Environmental detection may not map cleanly to human clinical risk.
- Sampling can stigmatize communities, farms, hospitals, or industries.
- Methods and targets may not be comparable across laboratories.
- High-resource settings may dominate global coverage.
- Signals could trigger inappropriate antibiotic or infection-control responses.
- Data could be misused for punitive enforcement without causal evidence.
equity_considerations: Sentinel placement must not turn marginalized communities into
  disproportionately monitored populations. Countries and communities generating samples
  should share governance and benefit from resulting capacity and knowledge.
success_metrics:
- Lead time relative to clinical detection for validated signals
- Concordance and added information versus clinical and animal surveillance
- Cross-laboratory reproducibility
- Geographic and income-level coverage
- False-alarm and non-actionable signal rate
- Time from signal to confirmatory investigation
- Evidence of local capacity and data-governance benefit
next_action: Create a literature and standards map of environmental AMR surveillance
  targets and compare them with clinical surveillance outcomes, explicitly identifying
  where environmental signals have and have not shown actionable lead time. No new
  sampling.
