summary: 'HK-0074 proposes making essential-medicine stockout risk visible before
  patients lose access. This bounded crosswalk finds substantial prior art in public
  regulatory shortage systems, especially for distinguishing anticipated versus actual
  shortages, tracking current/resolved states, reasons and mitigation information,
  and—in the EU—machine-to-machine shortage-reporting interoperability. That overlap
  weakens any case for a new standalone shortage dashboard or reporting platform.
  The residual question is narrower: whether existing public systems expose a portable,
  non-sensitive semantic layer for uncertainty/data-missingness, expected time-to-stockout,
  response-state history, and retrospective false-alarm/miss validation. The reviewed
  public documentation does not establish that those residual semantics are consistently
  available across systems. Recommendation is therefore `needs-scope` for human consideration
  only, not a lifecycle change.'
findings:
- SOURCED — WHO's 2017 technical consultation treats shortage/stockout notification
  as an established systems problem across supply- and demand-side causes, with patient
  harm possible from higher costs, poorer outcomes, inappropriate substitution, and
  falsified-product risk. This is strong prior art against treating shortage notification
  itself as novel.
- SOURCED — FDA maintains a public Drug Shortages Database covering current and resolved
  shortages and discontinuations; FDA states the list is updated daily with new/resolved
  shortages and additional supplier-capacity information. Resolved shortages remain
  visible for six months and discontinued shortages for one year.
- SOURCED — EMA's public shortage catalogue reports shortage reason, current status
  (ongoing/resolved), extent, and information for patients and healthcare professionals.
  The European Shortages Monitoring Platform (ESMP) additionally collects supply,
  demand, and availability data and supports machine-to-machine interoperability with
  national-authority and industry systems.
- SOURCED — Health Canada requires reporting of both anticipated and actual prescription-drug
  shortages. Its public system can be searched for actual and anticipated shortages
  and discontinuations. Canada defines an actual shortage as current supply unable
  to meet demand and an anticipated shortage as future supply that may not meet projected
  demand; manufacturers should not wait for complete stock-out before reporting.
- SOURCED — Australia's TGA Medicine Shortages Reports Database publicly distinguishes
  current, anticipated, resolved shortages and discontinuations, includes management-action
  information, and offers a downloadable extract.
- INFERENCE — `anticipated shortage`, `actual/current shortage`, `resolved`, `discontinued`,
  reason/cause, and basic mitigation/management state should be classified as **already
  covered or substantially covered** by mature public systems, not distinctive HK-0074
  features.
- INFERENCE — Interoperable reporting is **already covered in a meaningful regional
  implementation** by EMA ESMP's machine-to-machine interface. A new platform would
  need to demonstrate a material cross-system interoperability gap rather than merely
  restating this capability.
- INFERENCE — Publicly documented support for `expected_time_to_stockout`, explicit
  confidence/uncertainty grades, low-data/missingness state, false-alarm/miss semantics,
  and retrospective validation appears **partial, unclear, or meaningfully absent**
  in this bounded review. This is a candidate residual gap, not an established one.
- INFERENCE — Facility-level stock-on-hand, supplier-confidential quantities, and
  fine-grained vulnerability data should not be presumed appropriate for a public
  commons even if useful operationally; the safest candidate contribution is a public
  semantic crosswalk/profile, not collection of sensitive inventory data.
