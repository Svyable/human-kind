uncertainties:
- This is a documentation crosswalk, not an exhaustive audit of every field, API schema,
  national implementation, wholesaler system, hospital inventory platform, or procurement
  dataset. A semantic marked unclear may exist in technical documentation not retrieved
  here.
- Regulatory shortage systems operate at different scopes and granularity. A national
  drug-shortage report is not equivalent to facility-level stock-on-hand or patient
  access, so overlap at the reporting layer does not prove equivalent operational
  capability.
- EMA ESMP has richer regulator/industry reporting than what is necessarily public
  in the shortage catalogue; this review does not infer that every ESMP field is publicly
  accessible.
- Anticipated-shortage states encode some uncertainty but do not by themselves establish
  calibrated probability, confidence, or forecast-error semantics.
- TGA management actions and EMA patient/professional information demonstrate mitigation-state
  coverage, but this review does not establish a common interoperable response-state
  vocabulary across jurisdictions.
- A cross-system schema could create false comparability if definitions of shortage,
  market scope, product identifiers, reporting obligations, and resolution differ
  materially across jurisdictions.
- No claim here establishes that a public warning layer improves patient outcomes,
  predicts facility stockouts, or outperforms existing local supply-chain practice.
risks:
- Publishing granular facility, supplier, stock-on-hand, lead-time, or vulnerability
  information could expose commercially sensitive or security-sensitive supply conditions
  and should not be treated as a default openness goal.
- A cross-jurisdiction warning score could imply precision that the underlying definitions
  and reporting obligations do not support.
- False alarms can induce hoarding or inefficient procurement; misses can create false
  reassurance. This review does not recommend operational thresholds.
- Public mitigation information must not be converted by an agent into clinically
  consequential substitution advice.
- A new dashboard could duplicate regulator infrastructure, fragment identifiers,
  and create stale or conflicting shortage signals.
recommended_status: needs-scope
next_action: 'For human consideration, do not build a new shortage-reporting platform.
  Draft a small, non-authoritative **cross-system interoperability profile** using
  only public or synthetic data and only the residual semantics that remain unresolved
  after human verification: `signal_state` (anticipated / actual / resolved / discontinued),
  `evidence_timestamp`, `data_missingness_state`, `time_to_stockout_semantics` (reported
  / inferred / absent), `response_state`, `resolution_timestamp`, and optional retrospective
  `false_alarm` / `miss` / `latency` annotations. Map those fields to FDA, EMA/ESMP,
  Health Canada, and TGA public semantics. Drop any field already adequately represented.
  Do not collect facility inventories, supplier-confidential data, patient data, recommend
  substitutions or purchases, contact external organizations, or deploy a warning
  system.'
