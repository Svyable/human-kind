id: HK-0050
title: Turn global methane super-emitter alerts into accountable rapid-response loops
status: intake
domains:
- climate
geography:
- global
time_horizon: short
problem_statement: Satellite systems can now detect very large methane emissions globally,
  but detection does not reliably become mitigation. UNEP reports that MARS notifications
  have enabled verified mitigation cases while response rates still lag in many jurisdictions.
  The gap is increasingly an accountability and response-design problem, not only
  a sensing problem.
beneficiaries:
- Communities exposed to oil, gas, coal, and waste-sector pollution
- People affected by near-term climate warming
- Operators and regulators seeking actionable emissions data
theory_of_change: If high-confidence methane alerts are converted into transparent,
  time-bounded response records with verification and escalation states, then fewer
  actionable leaks may disappear into institutional handoffs and the time from detection
  to mitigation may fall.
intervention_type:
- standards
maturity: concept
evidence_level: hypothesis
expected_impact: unknown
cost_band: unknown
reversibility: high
key_risks:
- Incorrect source attribution could unfairly accuse operators.
- Public deadlines could incentivize superficial closure rather than real mitigation.
- Satellite coverage and detection thresholds create geographic and sector blind spots.
- Response transparency could expose sensitive operational information.
- The protocol could duplicate or interfere with existing regulator workflows.
equity_considerations: Communities near emitting facilities bear local pollution burdens
  and should not be reduced to passive data subjects. Operators need a fair correction
  and uncertainty process. Jurisdictions with weak satellite coverage or response
  capacity should not be scored as though observability and resources were equal.
success_metrics:
- Median time from alert to acknowledgement
- Median time from alert to verified mitigation or justified closure
- Share of alerts with explicit uncertainty and attribution confidence
- False-attribution and correction rate
- Response completion rate
- Distribution of coverage and response across regions and sectors
next_action: Build a retrospective benchmark from public MARS events and test whether
  a minimal response-state schema can represent detection, acknowledgement, investigation,
  mitigation, verification, dispute, and closure without inventing missing facts.
  Do not contact operators or regulators.
