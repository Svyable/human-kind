uncertainties:
  - >-
    The public materials reviewed here do not provide a causal estimate of whether public
    response-state tracking or deadlines shorten time to mitigation relative to current MARS
    practice.
  - >-
    Public response-rate data aggregate feedback at source and country level; they do not by
    themselves distinguish acknowledgement, investigation, verified mitigation, justified
    non-action, correction, or dispute.
  - >-
    The reviewed material does not establish how often attribution is corrected, how long
    disputes take, or how much public accountability changes operator or regulator behavior.
  - >-
    Observability differs by satellite, geography, sector, plume magnitude, revisit timing,
    cloud conditions, and whether a source is eligible for notification; those differences can
    bias apparent response performance.
  - >-
    Documented mitigation cases are selected successful cases and should not be treated as a
    representative denominator for all notifications.
risks:
  - >-
    Incorrect or premature attribution could unfairly accuse an operator or jurisdiction and
    create incentives to contest the system rather than mitigate emissions.
  - >-
    Deadline metrics can become Goodhart targets, rewarding fast acknowledgement or nominal
    closure instead of durable physical mitigation.
  - >-
    Jurisdictions with weaker monitoring, regulatory capacity, or response resources may look
    worse even when underlying effort is comparable, creating distributional and legitimacy
    problems.
  - >-
    Publishing operational detail beyond what MARS already makes public could expose sensitive
    facility information; a retrospective benchmark should use only already-public fields.
  - >-
    Treating missing feedback as proof of no mitigation, or feedback as proof of mitigation,
    would fabricate outcomes and bias the benchmark.
  - >-
    No result in this review authorizes outreach, live deadlines, enforcement, mitigation,
    procurement, deployment, or any other real-world intervention.
recommended_status: needs-evidence
next_action: >-
  Build a repository-only retrospective benchmark from already-public MARS records. For each
  record where public data permit, represent detection confidence, attribution confidence,
  notification date, acknowledgement/feedback state, investigation evidence, mitigation claim,
  independent verification evidence, dispute/correction state, and closure reason. Predefine
  event inclusion rules and report missing fields explicitly. Compare whether richer state
  information is associated with shorter time to independently verified mitigation without
  claiming causation. Stratify or annotate obvious observability and capacity differences and
  test whether apparent performance changes when acknowledgement is separated from mitigation.
  Use no private data, contact no external parties, create no live deadlines, and make no
  operational recommendations.
