summary: >-
  HK-0050 is strongest where it asks for clearer provenance and state transitions between
  satellite detection, notification, investigation, mitigation evidence, and closure. UNEP's
  MARS documentation shows that large methane events can be detected, notified, and in some
  cases followed by satellite-verified mitigation, while response remains incomplete. The
  central transfer assumption is not yet established: UNEP defines its public response-rate
  metric as feedback received on notified sources, not verified physical mitigation, and the
  public materials reviewed here do not establish that adding public deadlines or richer
  response-state tracking would itself cause faster or more complete mitigation. Recommendation
  for human consideration: needs-evidence, with the next step limited to a retrospective
  benchmark using already-public MARS records and explicit missing-data handling.
findings:
  - >-
    SOURCED — UNEP describes MARS as a workflow that detects large methane emissions, notifies
    governments and relevant companies, asks stakeholders to share actions, and where possible
    continues satellite monitoring so mitigation can be independently observed.
  - >-
    SOURCED — UNEP's public response-rate data dictionary defines response as substantive
    feedback from a government or operator about a notified source. It is therefore an
    engagement metric, not a direct measure of verified physical mitigation.
  - >-
    SOURCED — UNEP reported in October 2025 that responses to more than 3,500 alerts had risen
    to 12 percent from about 1 percent the prior year, while nearly 90 percent remained
    unanswered. This supports a real follow-through gap but does not identify the causal effect
    of any particular accountability mechanism.
  - >-
    SOURCED — UNEP states that MARS has documented more than 40 mitigation cases across four
    continents as of April 2026, demonstrating that notification can be followed by verifiable
    action in some cases.
  - >-
    INFERENCE — A higher response rate could reflect more reporting, stronger pre-existing
    institutions, easier-to-fix sources, better observability, or actual faster mitigation.
    Without event-level timing and counterfactual comparison, these mechanisms cannot be
    separated.
  - >-
    INFERENCE — Public deadlines could improve accountability, but they could also incentivize
    superficial acknowledgement, premature closure, or selective reporting. A retrospective
    benchmark should therefore score acknowledgement, investigation, mitigation evidence,
    independent verification, dispute, and closure separately rather than collapsing them.
  - >-
    INFERENCE — Attribution confidence should be represented separately from detection
    confidence. A detected plume does not by itself establish operator responsibility, and a
    fair protocol needs correction and dispute states before public accountability claims are
    treated as settled.
  - >-
    INFERENCE — Cross-country response comparisons can be misleading if satellite coverage,
    notification eligibility, focal-point availability, regulatory capacity, operator
    participation, and public-data completeness differ. Missing or unobservable records must
    not be interpreted as no action or no need.
