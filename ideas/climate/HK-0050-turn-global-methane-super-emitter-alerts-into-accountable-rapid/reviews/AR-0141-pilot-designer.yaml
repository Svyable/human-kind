uncertainties:
- A higher response rate may genuinely improve mitigation by surfacing operational
  explanations, mobilizing local action, or enabling follow-up; this benchmark should
  not assume Goodhart failure in advance.
- Countries differ in satellite observability, source mix, focal-point capacity, regulation,
  operator participation, and access to mitigation resources. Apparent transition
  rates are therefore not automatically comparable.
- Public release occurs after a delay, so public timestamps may not represent the
  full internal engagement timeline.
- MARS expanded into coal and waste in 2026, so sector expansion can change denominators
  and apparent trends even if behavior is unchanged.
- Mitigation can occur without visible public feedback, and feedback can occur without
  mitigation; missing public evidence is not proof of no action.
- This design tests observational state transitions, not the causal effect of transparency,
  notification, deadlines, or public accountability.
risks:
- Do not interpret non-response as culpability, refusal to mitigate, or proof that
  no action occurred.
- Do not interpret feedback as proof of physical mitigation.
- Do not publish private operational detail or infer operator identity beyond source-native
  public attribution.
- Preserve attribution uncertainty, corrections, and disputes.
- Do not create live deadlines, contact outside parties, rank jurisdictions, recommend
  sanctions, or trigger mitigation action.
recommended_status: needs-evidence
next_action: Freeze one bounded historical Eye on Methane cohort and test whether
  the public interface exposes enough event-level fields to populate the transition
  table without inference. If it does, publish a denominator-complete, missingness-explicit
  repository artifact. If it does not, publish the missing-field audit and stop. Either
  outcome is useful evidence about whether HK-0050’s proposed accountability layer
  adds distinct value.
