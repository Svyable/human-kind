summary: 'HK-0050’s strongest unresolved question is now experimentally sharper: does
  a higher MARS **response rate** meaningfully track faster, independently verified
  methane mitigation, or mainly increased feedback/engagement? UNEP’s current public
  definition measures response as substantive feedback from governments/operators
  on notified sources, while its June 23, 2026 announcement sets a goal of raising
  country response rates to 80% by 2030 and says only 10 early-moving countries had
  reached that level. That creates a concrete Goodhart risk: optimizing an engagement
  metric could look like success even when physical mitigation remains unverified.


  This Pilot Designer contribution proposes a repository-only retrospective benchmark
  that preserves MARS’s actual state transitions rather than collapsing them into
  one success label. It does not contact operators or governments, create live deadlines,
  recommend enforcement, infer fault from non-response, or claim causal impact.'
findings:
- 'SOURCED — UNEP describes MARS as a four-stage process: detect/attribute; notify/engage;
  stakeholder action; then track/collaborate/learn, with continued satellite monitoring
  where possible.'
- SOURCED — Eye on Methane states that all detections are published after a delay,
  including detections that did not lead to notification because they were not attributable
  or were older than 15 days.
- SOURCED — UNEP defines the monthly country response rate as the percentage of notified
  emission sources for which IMEO received feedback from governments or operators.
  This is an engagement/feedback metric, not a verified-mitigation metric.
- SOURCED — On June 23, 2026, UNEP announced an effort to raise response to major
  methane leaks to 80% by 2030 and stated that only 10 early-moving countries had
  achieved an 80% response rate at that point.
- SOURCED — UNEP says MARS had documented more than 40 mitigation cases across four
  continents as of April 2026, while also stating that responses and action have not
  kept pace with notifications.
- INFERENCE — A target on response rate can create Goodhart pressure if acknowledgement
  or feedback becomes easier to optimize than independently verified physical mitigation.
- INFERENCE — A defensible benchmark therefore needs distinct states for `detected`,
  `attributable`, `notified`, `feedback_received`, `mitigation_claimed`, `mitigation_independently_verified`,
  `disputed_or_corrected`, and `closure_or_unknown`.
- INFERENCE — The denominator must be explicit at each transition. `feedback_received
  / notified_sources` answers a different question from `verified_mitigation / all_detected_sources`
  or `verified_mitigation / attributable_notified_sources`.
- INFERENCE — Detections that were not attributable or not notification-eligible are
  analytically important because restricting analysis to notified sources can make
  downstream performance look better by conditioning on an easier subset.
- INFERENCE — Published mitigation case studies demonstrate feasibility but are selected
  positive cases; they cannot by themselves establish the mitigation rate among all
  notifications.
