  messaging study: https://www.air.org/news/press-release/new-federal-study-finds-text-messages-parents-can-reduce-chronic-school-absences'
- Recent multi-district evidence reports modest average reductions in absences, not
  elimination of chronic absenteeism. The 2026 rural trial also reports implementation
  failures, substantial negative caregiver feedback in responding districts, and a
  subgroup estimate for Black students that the authors say warrants caution and further
  study. These limitations are material counterevidence against treating messaging
  as universally benign or sufficient.
