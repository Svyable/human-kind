uncertainties:
- The tutoring meta-analysis provides substantial positive evidence, so the relevant
  uncertainty is not whether tutoring can work but whether a chosen local implementation
  preserves the conditions associated with those effects.
- The lower-cost technology-assisted tutoring RCT demonstrates that some delivery
  changes can retain substantial effects, so staffing and cost constraints do not
  by themselves imply that scaling will fail.
- The early-reading trial reports strong results in a scalable short-burst model,
  which is counterevidence to a blanket claim that lower-intensity or operationally
  simpler models necessarily sacrifice effectiveness.
- The dossier currently spans multiple ages, subjects, tutor types, group sizes, and
  delivery modes; it is uncertain which evidence should be considered directly transportable
  to any future target setting.
- The subgroup heterogeneity observed in some studies may reflect tutor characteristics,
  context, chance, or other mechanisms; it should not be generalized to demographic
  groups without further evidence.
- The 2026 AI-tutoring evidence concerns an AI-supported remedial math context, not
  the dossier's core human small-group model; it is relevant specifically to the dossier's
  technology-assisted scaling risk, not as a direct test of the central intervention.
risks:
- Scaling pressure could favor easier-to-staff or technology-heavy models that no
  longer instantiate the mechanism responsible for the strongest evidence.
- Students with unstable attendance may receive systematically lower dosage while
  still being counted as offered tutoring, potentially widening gaps in realized benefit.
- Scheduling tutoring during the school day can displace core instruction, electives,
  disability services, meals, rest, or peer activities; those opportunity costs may
  differ across students.
- Need-based targeting can stigmatize participants or create opaque eligibility thresholds
  unless selection rules and appeals are transparent.
- Average outcome reporting can mask access, dosage, attrition, or effect differences
  for multilingual learners, students with disabilities, or other locally relevant
  groups.
- Short-term standardized-test gains may not persist or may fail to capture broader
  educational costs and benefits.
- This review is literature-based and does not establish stakeholder preferences,
  local feasibility, or implementation acceptability.
recommended_status: needs-evidence
