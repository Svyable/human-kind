summary: 'HK-0023 proposes high-frequency, targeted small-group tutoring for students
  substantially behind learning goals. The central mechanism is plausible and supported
  by randomized tutoring evidence, but average efficacy should not be treated as evidence
  that a specific school implementation will preserve effect size, equity, or cost-effectiveness.
  The strongest reason for caution is heterogeneity: effects vary with tutor model,
  age, subject, group size, dosage, and implementation context, while scaling strategies
  can change the mechanism itself. This review recommends keeping the dossier at `needs-evidence`
  until the proposed evidence map separates efficacy from implementation and scaling
  assumptions.'
findings:
- SOURCED — The Nickow, Oreopoulos, and Quan meta-analysis reports a pooled tutoring
  effect around 0.37 SD, but also reports meaningful variation by tutor type, grade,
  subject, timing, and program context; teacher/paraprofessional tutoring and in-school
  delivery tend to perform better on average.
- SOURCED — Fryer and Howard-Noveck's randomized high-dosage reading study found positive
  but statistically insignificant mean ELA effects, no math effect, and substantial
  heterogeneity across student groups, illustrating that high dosage alone does not
  guarantee uniform academic gains.
- SOURCED — Bhatt et al. show that a lower-cost model combining tutor time with computer-assisted
  learning produced a 0.23 SD math gain, while explicitly identifying staffing and
  cost as central scaling constraints. This supports scalability potential but also
  shows that scale requires changing delivery design rather than simply reproducing
  intensive tutoring.
- SOURCED — Carlana and La Ferrara find positive effects from online tutoring, with
  higher dosage producing stronger effects and group tutoring producing smaller effects
  than individual tutoring. Group size and dosage therefore appear consequential rather
  than interchangeable implementation details.
- SOURCED — Cortes et al. report strong effects from short-burst 1:1 early-reading
  tutoring in kindergarten, which is encouraging but materially different from the
  dossier's broader target population and reinforces the need to avoid transferring
  one age/subject/model result wholesale.
- SOURCED — Oreopoulos and Low's 2026 randomized Khanmigo study found only modest
  gains and very limited substantive AI-tutor engagement; the authors identify engagement
  as a binding constraint. Technology-assisted scaling can therefore alter utilization
  and mechanism, not merely lower cost.
- INFERENCE — A school can implement something called “high-frequency tutoring” while
  varying the active ingredients enough that the evidence base becomes only weakly
  predictive. The dossier should pre-specify which features are treated as mechanism-critical
  versus adaptable.
- 'INFERENCE — Opportunity cost should be evaluated as an outcome, not only a narrative
  risk: tutoring that raises tested achievement while displacing valued instruction,
  electives, rest, or support services may have ambiguous net benefit.'
- INFERENCE — Average treatment effects can conceal unequal access or unequal realized
  dosage. Eligibility, attendance, disability accommodation, language access, tutor
  assignment, and scheduling should be measured as distributional implementation outcomes.
