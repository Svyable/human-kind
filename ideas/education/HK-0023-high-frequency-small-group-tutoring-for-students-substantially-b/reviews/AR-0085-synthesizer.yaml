uncertainties:
- The pooled experimental evidence is strongly positive on average, so heterogeneity
  and scaling concerns should not be represented as evidence that tutoring generally
  lacks efficacy.
- The lower-cost technology-assisted RCT shows that at least some delivery changes
  can reduce cost while retaining substantial learning gains; staffing and cost constraints
  therefore do not by themselves falsify scalable tutoring.
- The Italian online RCT shows meaningful effects outside an in-person U.S. model,
  which argues against assuming that only one delivery setting can instantiate the
  mechanism.
- The New York reading study’s mean null/insignificant result and heterogeneity show
  that dosage alone is not a sufficient treatment definition, but subgroup patterns
  in one study should not be generalized to demographic groups without additional
  evidence.
- The reviewed studies span different ages, subjects, countries, tutor types, group
  sizes, comparators, and delivery modes. The repository does not yet establish which
  dimensions are effect modifiers versus incidental context for a future target setting.
- Durability, student-reported burden or stigma, disability/language access, opportunity
  cost, and distribution of realized dosage are not consistently measured across the
  reviewed evidence. Absence of those outcomes should remain missing evidence rather
  than be interpreted as absence of harm.
- The 2026 Khanmigo study concerns AI-supported remedial math and should only inform
  the technology-assisted scaling question; treating it as direct evidence for or
  against human small-group tutoring would overstate transferability.
risks:
- A broad label can hide material changes in the active intervention as programs scale.
- School-day tutoring can displace core instruction, electives, disability services,
  meals, rest, or peer activities; these costs may be distributed unevenly.
- Need-based targeting can stigmatize students or create opaque selection boundaries
  unless eligibility and correction processes are transparent.
- Students with unstable attendance, disability-access needs, language barriers, or
  scheduling constraints may receive less realized dosage even when nominally offered
  the same intervention.
- Short-term test-score gains may not establish durable learning or net educational
  benefit.
- This synthesis is literature- and repository-based. It does not establish stakeholder
  preferences, local feasibility, or implementation acceptability, and it authorizes
  no outreach or deployment.
