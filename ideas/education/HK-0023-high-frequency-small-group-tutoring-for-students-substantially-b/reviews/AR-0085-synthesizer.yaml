summary: 'HK-0023 has a strong evidence-backed case that tutoring can improve learning,
  but the dossier and landed Skeptic review also support a narrower conclusion: average
  tutoring efficacy does not identify a single implementation that can be assumed
  to preserve effect size, equity, durability, or cost-effectiveness when scaled.
  The central disagreement is therefore not “tutoring works” versus “tutoring does
  not work.” It is whether the mechanism-critical features behind the strongest results—tutor
  model, age/subject match, dosage, group size, school-day integration, engagement,
  and implementation fidelity—can be specified tightly enough for evidence from heterogeneous
  trials to predict a future local design. Human verification is required before any
  claim here is treated as verified project knowledge.'
findings:
- SOURCED — Nickow, Oreopoulos, and Quan’s systematic review/meta-analysis reports
  a pooled tutoring effect of about 0.37 SD across experimental studies, with meaningful
  variation by tutor type, grade, subject, timing, and context; teacher/paraprofessional
  and in-school tutoring tend to have larger average effects.
- SOURCED — Two randomized Chicago high-school evaluations reported math-test gains
  of 0.16 SD and 0.37 SD plus course-grade gains, supporting the proposition that
  intensive tutoring can produce substantial effects for adolescents as well as younger
  students. The authors also frame cost and scalable delivery as central design concerns.
- SOURCED — A randomized lower-cost in-school math model that alternated tutor time
  with computer-assisted learning reported a 0.23 SD gain for participating students
  and roughly 30% lower per-pupil cost than the referenced 2:1 model. This is counterevidence
  to a blanket claim that modifying intensive tutoring for scale must erase effects.
- SOURCED — A randomized online tutoring program in Italy reported individual-tutoring
  math gains of 0.23 SD in 2020 and 0.20 SD in 2022; higher dosage produced stronger
  effects and group tutoring smaller effects. This supports online delivery as potentially
  effective while also showing that dosage and group size are consequential.
- SOURCED — A randomized high-dosage reading intervention in New York City produced
  a positive but statistically insignificant mean ELA effect and no math effect, with
  substantial heterogeneity. This is direct counterevidence against treating high
  dosage alone as sufficient for uniform gains.
- SOURCED — A 2026 cluster-randomized Khanmigo study reported roughly 0.06–0.08 SD
  annual math gains, similar to ordinary Khan Academy practice, while substantive
  AI-tutor engagement was limited. This is not a direct test of HK-0023’s core human
  small-group model, but it supports the Skeptic review’s narrower warning that technology-assisted
  scaling can change utilization and mechanism rather than merely reduce cost.
- INFERENCE — The strongest common ground is that personalized instructional intensity
  is plausible, but “high-frequency small-group tutoring” is too broad to function
  as a transportable treatment definition without predeclared mechanism-critical features.
- INFERENCE — Evidence of efficacy and evidence of scalable implementation should
  remain separate. A lower-cost model retaining gains is relevant positive evidence,
  but it does not establish that other substitutions in tutor skill, dosage, group
  size, scheduling, or technology will preserve effects.
- INFERENCE — Opportunity cost and realized dosage should be treated as outcomes.
  A program can show positive test effects while still imposing unequal access, displacing
  valued instruction or services, or delivering systematically less tutoring to students
  with unstable attendance or accessibility barriers.
