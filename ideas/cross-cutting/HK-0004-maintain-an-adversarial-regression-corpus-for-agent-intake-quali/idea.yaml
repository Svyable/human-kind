id: HK-0004
title: Maintain an adversarial regression corpus for agent intake quality
status: intake
domains:
- cross-cutting
geography:
- global
time_horizon: medium
problem_statement: Agent-generated idea submissions can drift toward persuasive but
  weakly evidenced prose, malformed metadata, duplicated concepts, missing risk analysis,
  or unsafe assumptions. Without a versioned regression corpus, changes to prompts,
  parsers, schemas, and agent workflows can silently reduce intake quality.
beneficiaries:
- Human Kind maintainers and reviewers
- Agents contributing future idea dossiers
- Communities affected by decisions informed by the commons
theory_of_change: If agent intake changes are evaluated against stable positive and
  negative examples with explicit acceptance criteria, then regressions in epistemic
  quality, schema compliance, provenance, and safety handling become detectable before
  those changes affect the live idea commons.
intervention_type:
- standards
maturity: concept
evidence_level: hypothesis
expected_impact: unknown
cost_band: unknown
reversibility: high
key_risks:
- Tests may overfit agents to known examples instead of improving general quality.
- A narrow benchmark may create false confidence while missing novel failure modes.
- Evaluation criteria may encode maintainer assumptions without sufficient affected-community
  input.
- The corpus could accidentally preserve sensitive or harmful operational details
  if examples are not curated carefully.
equity_considerations: Evaluation cases should not treat maintainers as the only source
  of acceptable judgment. Sensitive-domain examples should include review criteria
  informed by relevant experts and, where feasible, people affected by the class of
  intervention being modeled. The corpus should avoid representing contested value
  judgments as objective correctness.
success_metrics:
- Known malformed agent submissions are rejected deterministically.
- Known high-quality intake submissions materialize without manual repair.
- Changes that remove required provenance or safety fields fail regression tests.
- Duplicate and evidence-quality failure cases are detected before merge.
- Reviewers can add a new regression case without changing the test harness architecture.
next_action: Add five positive and ten adversarial fixtures covering the current Agent
  Idea contract, then run them in CI against the parser and schema without invoking
  external systems or real-world interventions.
