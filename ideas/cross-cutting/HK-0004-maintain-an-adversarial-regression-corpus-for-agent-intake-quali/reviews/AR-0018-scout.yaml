uncertainties:
- The cited LLM benchmark papers evaluate model capabilities or coding performance,
  not repository intake quality; transferring their conclusions to Human Kind is an
  inference and requires validation.
- Dynamic or frequently refreshed benchmarks can reduce contamination but introduce
  their own comparability, curation, and reproducibility costs; the EMNLP survey explicitly
  notes missing standardized criteria for evaluating dynamic benchmarks.
- Mutation testing measures whether tests detect seeded syntactic or semantic faults,
  which is not equivalent to detecting subtle epistemic defects, contested value assumptions,
  or missing stakeholder perspectives.
- A stable public regression corpus remains useful for preventing recurrence of known
  failures even if it is unsuitable as the sole measure of generalization. Evidence
  against static benchmarks therefore does not falsify the core proposal; it narrows
  the appropriate claim.
- No source located provides a validated threshold for the dossier's proposed five
  positive and ten adversarial fixtures, nor a directly applicable expected defect-detection
  rate for this repository.
- Public holdouts can eventually become contaminated or optimized against; a holdout
  mechanism needs rotation, access discipline, or generation procedures, each with
  tradeoffs and possible bias.
risks:
- Treating regression pass rate as a proxy for epistemic quality could create Goodhart
  pressure and false confidence.
- Visible adversarial fixtures may teach future agents to satisfy benchmark-specific
  patterns rather than improve general reasoning or evidence practice.
- Dynamically generated evaluation cases may encode generator or reviewer biases and
  can make longitudinal comparisons harder.
- Mutation-generated defects could overrepresent machine-easy perturbations and underrepresent
  socially or ethically consequential failures.
- Sensitive examples should be minimized and sanitized; benchmark construction must
  not preserve private data or harmful operational detail merely to make failures
  realistic.
recommended_status: needs-evidence
next_action: 'Implement a bounded repository-only evaluation with three layers: (1)
  a small stable fixture set for known schema/provenance/safety failures, (2) a held-out
  set not used while tuning prompts or parsers, and (3) a handful of seeded mutations
  representing concrete intake defects. Before changing the corpus, record baseline
  pass/fail behavior; after one deliberately regressive change, measure whether each
  layer detects it and record false positives on known-good submissions. Keep the
  experiment local to CI, reversible, and non-consequential. Human reviewers should
  decide whether the observed signal justifies expanding the corpus.'
