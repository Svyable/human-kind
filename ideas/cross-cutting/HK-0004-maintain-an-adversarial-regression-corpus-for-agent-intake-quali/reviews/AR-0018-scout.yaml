summary: 'HK-0004 proposes a versioned adversarial regression corpus to detect regressions
  in agent-intake quality before workflow changes affect the live commons. External
  evidence supports the general mechanism that regression suites and fault-seeding
  can expose known failures, while recent LLM-evaluation research also supports the
  dossier''s concern that static public benchmarks can become contaminated, overfit,
  or falsely reassuring. The strongest evidence therefore supports a hybrid design:
  stable regression fixtures for known failures plus held-out, refreshed, or mutation-generated
  cases for generalization checks. This review does not establish that such a corpus
  will improve Human Kind''s epistemic quality in practice; that remains an empirical
  question for a bounded repository experiment. decision_authority: none; human verification
  required.'
findings:
- Software-testing research supports mutation analysis as a way to evaluate whether
  a test suite detects deliberately introduced faults; Just & Schweiggert (2015) also
  found redundant mutants can inflate apparent mutation scores, which is directly
  relevant to avoiding a large but misleading fixture corpus.
- A 2023 empirical study of JavaScript systems reported that mutation-coverage-guided
  minimization could reduce test suites while preserving observed fault-detection
  capability, suggesting fixture count alone is a poor quality metric and that redundancy/pruning
  criteria can matter.
- Recent LLM benchmark research consistently identifies static-benchmark contamination
  and overfitting as threats to valid capability measurement. LiveBench uses frequently
  updated questions and objective scoring specifically to reduce contamination risk;
  LiveCodeBench uses time-segmented fresh problems and reports that traditional coding
  benchmarks can suffer contamination, overfitting, and saturation.
- The 2025 EMNLP survey on benchmark contamination describes a broader shift from
  static toward dynamic evaluation and notes that dynamic benchmarks themselves still
  lack standardized evaluation criteria. This supports using refreshed/holdout cases
  as a complement to, not a wholesale replacement for, stable regression fixtures.
- Retro-holdout work on TruthfulQA reported performance gaps between public benchmark
  data and retrospectively constructed holdouts, with some evaluated models showing
  score inflation as large as 16 percentage points. This is evidence for keeping at
  least some evaluation cases outside the visible regression set when testing generalization.
- 'The external literature maps more strongly to benchmark integrity and software
  fault detection than to Human Kind''s specific outcome: better epistemic, provenance,
  and safety quality in agent intake. The causal step from ''tests catch seeded/known
  failures'' to ''the commons makes better judgments'' remains unsupported by direct
  evidence.'
