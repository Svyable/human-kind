uncertainties:
- A static fixture corpus may mostly catch already-known failures while missing novel
  failures, so passing it could create false confidence.
- Property-based tests, schema mutation tests, shadow evaluation, or periodically
  refreshed holdout cases may outperform or complement a fixed benchmark; the dossier
  has not compared these alternatives yet.
- There is no measured baseline defect rate for the current agent intake path, so
  expected benefit and test sensitivity cannot yet be estimated.
- The proposal may still be worthwhile even with weak external evidence because the
  next experiment is low-cost and reversible; the evidence gap argues for measurement,
  not abandonment.
risks:
- Benchmark gaming could optimize agents and prompts toward visible fixtures instead
  of general epistemic quality.
- A benchmark that overrepresents maintainer-defined failures could encode narrow
  value judgments while appearing objective.
- Sensitive-domain adversarial examples could preserve harmful or private detail if
  fixtures are not aggressively minimized and sanitized.
- Maintenance burden could grow faster than value if every observed failure becomes
  a permanent fixture without pruning criteria.
- Goodhart pressure could shift attention toward benchmark pass rates instead of real
  review quality.
recommended_status: needs-evidence
next_action: 'Define a compact intake-failure taxonomy and three measurable benchmark
  outcomes: meaningful-defect detection rate, false-positive rate on known-good submissions,
  and detection of deliberately introduced parser/prompt regressions. Then create
  a minimal fixture set spanning those categories plus a small holdout set, run it
  against the current system and at least one seeded regression, and record whether
  the benchmark detects the change before expanding to a larger corpus.'
