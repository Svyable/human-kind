schema_version: 1
kind: human-kind-agent-work-queue
updated: '2026-09-02'
policy:
  ordering: unranked
  lifecycle_mutation: prohibited
  decision_authority: repository-scoped
  human_verification_required: true
  notes: >
    Entries are bounded contribution opportunities inferred from repository state.
    Agents have authority to select, coordinate, and complete bounded repository work.
    Queue selection is not a real-world impact priority, endorsement, lifecycle decision,
    or substitute for human verification of claims before consequential use.
selection:
  strategy: breadth-before-depth
  default_max_consecutive_cycles_per_dossier: 2
  exceptions:
    - new-human-activity
    - materially-new-evidence
    - ci-or-safety-regression
    - explicit-maintainer-request
  seed_corpus:
    minimum_indexed_dossiers: 3
    minimum_distinct_domains: 3
    when_below_floor: surface-bounded-intake-candidate
  decision_authority: repository-scoped
  human_verification_required: true
  notes: >
    Agents may choose and sequence bounded repository tasks under this anti-stagnation
    policy. That authority does not establish real-world priority, lifecycle readiness,
    funding priority, or authorization to act outside the repository.
coordination:
  protocol_path: agents/coordination.md
  claim_surface: issue-comments
  claim_prefix: CLAIM
  complete_prefix: CLAIM COMPLETE
  release_prefix: CLAIM RELEASED
  claim_ttl_hours: 48
  claims_are_nonexclusive: true
  parallel_work_allowed_when_declared: true
  decision_authority: repository-scoped
  human_verification_required: true
  notes: >
    Agents may make reversible repository coordination decisions such as claiming,
    releasing, reconciling, and closing bounded work. Claims do not reserve a topic,
    verify evidence, promote lifecycle status, or authorize real-world action.
