schema_version: 1
kind: human-kind-agent-work-queue
updated: '2026-08-30'
policy:
  ordering: unranked
  lifecycle_mutation: prohibited
  decision_authority: none
  human_verification_required: true
  notes: >
    Entries are bounded contribution opportunities inferred from repository state.
    They are not project priorities, endorsements, or lifecycle decisions. Human
    verification governs whether claims are treated as verified project knowledge;
    it is not a merge prerequisite for a structured review artifact that satisfies
    repository schema, provenance, and CI checks.
selection:
  strategy: breadth-before-depth
  default_max_consecutive_cycles_per_dossier: 2
  exceptions:
    - new-human-activity
    - materially-new-evidence
    - ci-or-safety-regression
    - explicit-maintainer-request
  seed_corpus:
    minimum_indexed_dossiers: 3
    minimum_distinct_domains: 3
    when_below_floor: surface-bounded-intake-candidate
  decision_authority: none
  human_verification_required: true
  notes: >
    This is an anti-stagnation coordination heuristic, not a priority ranking.
    After two consecutive agent cycles on one dossier, switch targets by default.
    While the seed corpus is below the stated floor, a bounded, sourced intake
    candidate in an underrepresented domain is a valid next task. Do not manufacture
    novelty or bypass the normal Agent Idea intake contract.
coordination:
  protocol_path: agents/coordination.md
  claim_surface: issue-comments
  claim_prefix: CLAIM
  complete_prefix: CLAIM COMPLETE
  release_prefix: CLAIM RELEASED
  claim_ttl_hours: 48
  claims_are_nonexclusive: true
  parallel_work_allowed_when_declared: true
  decision_authority: none
  human_verification_required: true
  notes: >
    Claims are coordination signals only. They do not reserve a topic, confer
    priority, imply endorsement, or authorize lifecycle or real-world action.
work:
  - id: HK-0004-scout-evidence-map
    status: completed
    role: scout
    target_idea: HK-0004
    target_path: ideas/cross-cutting/HK-0004-maintain-an-adversarial-regression-corpus-for-agent-intake-quali
    contribution_type: structured-review
    objective: >
      Map relevant prior work, evaluation methods, and evidence for maintaining
      adversarial regression corpora for agent intake quality, including sources
      that could falsify or narrow the proposal.
    completion_signals:
      - source links are provided for substantive factual claims
      - prior art and counterevidence are both represented
      - claims requiring human verification are explicit
      - no lifecycle status is changed
    task_issue: https://github.com/Svyable/human-kind/issues/12
    completed_by_review: AR-0018
    entrypoint: https://github.com/Svyable/human-kind/pull/19

  - id: HK-0004-synthesizer-review
    status: open-issue
    role: synthesizer
    target_idea: HK-0004
    target_path: ideas/cross-cutting/HK-0004-maintain-an-adversarial-regression-corpus-for-agent-intake-quali
    contribution_type: structured-review
    objective: >
      Synthesize the dossier and existing Skeptic review into the strongest
      supported case, strongest unresolved objections, and concrete information
      gaps for human reviewers.
    completion_signals:
      - disagreement is preserved rather than averaged away
      - evidence strength and uncertainty are separated
      - unresolved questions are concrete and testable
      - no lifecycle status is changed
    entrypoint: https://github.com/Svyable/human-kind/issues/13

  - id: HK-0004-taxonomist-fit-check
    status: open-issue
    role: taxonomist
    target_idea: HK-0004
    target_path: ideas/cross-cutting/HK-0004-maintain-an-adversarial-regression-corpus-for-agent-intake-quali
    contribution_type: structured-review
    objective: >
      Check taxonomy fit, aliases, neighboring proposals, and duplicate risk for
      HK-0004 without changing its classification or lifecycle status.
    completion_signals:
      - potential duplicates or near-neighbors are linked when found
      - proposed taxonomy changes are explicitly recommendations only
      - ambiguity is recorded rather than silently resolved
      - no lifecycle status is changed
    entrypoint: https://github.com/Svyable/human-kind/issues/14

  - id: HK-0004-red-team-failure-modes
    status: open-issue
    role: red-team
    target_idea: HK-0004
    target_path: ideas/cross-cutting/HK-0004-maintain-an-adversarial-regression-corpus-for-agent-intake-quali
    contribution_type: structured-review
    objective: >
      Identify failure modes, gaming risks, false-confidence pathways, misuse,
      and regression-corpus blind spots, then propose bounded mitigations or tests.
    completion_signals:
      - plausible failure mechanisms are distinguished from speculation
      - affected stakeholders and misuse cases are named where relevant
      - mitigations favor reversible tests and measurable checks
      - no lifecycle status is changed
    entrypoint: https://github.com/Svyable/human-kind/issues/15

  - id: HK-0021-skeptic-equity-and-trust-review
    status: completed
    role: skeptic
    target_idea: HK-0021
    target_path: ideas/education/HK-0021-test-supportive-personalized-attendance-messages-with-equity-saf
    contribution_type: structured-review
    objective: >
      Stress-test the evidence and assumptions around caregiver trust, inaccurate
      alerts, structural causes of absence, delivery inequality, subgroup effects,
      and the risk that messaging shifts responsibility onto families without
      addressing underlying barriers.
    completion_signals:
      - supporting evidence and counterevidence are both cited
      - structural and subgroup failure modes are distinguished from speculation
      - uncertainty and affected-stakeholder considerations are explicit
      - claims requiring human verification are explicit
      - no lifecycle status, priority, or accepted classification is changed
    human_verification_required: true
    decision_authority: none
    task_issue: https://github.com/Svyable/human-kind/issues/24
    review_submission: https://github.com/Svyable/human-kind/issues/40
    completed_by_review: AR-0040
    entrypoint: https://github.com/Svyable/human-kind/pull/41
    notes: >
      The structured Skeptic review landed as a reviewable contribution. Its claims
      still require human verification and do not constitute a lifecycle, acceptance,
      priority, classification, outreach, or implementation decision.

  - id: HK-0023-skeptic-implementation-and-equity-review
    status: completed
    role: skeptic
    target_idea: HK-0023
    target_path: ideas/education/HK-0023-high-frequency-small-group-tutoring-for-students-substantially-b
    contribution_type: structured-review
    objective: >
      Stress-test transfer from tutoring efficacy evidence to realistic school
      implementation, including heterogeneity, tutor supply and quality, dosage,
      opportunity costs, stigma, unequal access, subgroup effects, scalability,
      and durability of learning gains.
    completion_signals:
      - supporting evidence and counterevidence are both cited
      - efficacy claims are separated from scaling and opportunity-cost assumptions
      - equity, accessibility, stigma, and subgroup risks are explicit
      - claims requiring human verification are explicit
      - no lifecycle status, priority, or accepted classification is changed
    human_verification_required: true
    decision_authority: none
    task_issue: https://github.com/Svyable/human-kind/issues/32
    completed_by_review: AR-0034
    entrypoint: https://github.com/Svyable/human-kind/pull/35

  - id: HK-0023-synthesizer-evidence-and-disagreement-map
    status: open-issue
    role: synthesizer
    target_idea: HK-0023
    target_path: ideas/education/HK-0023-high-frequency-small-group-tutoring-for-students-substantially-b
    contribution_type: structured-review
    objective: >
      Synthesize the dossier and landed Skeptic review into the strongest supported
      case, strongest unresolved implementation and equity objections, and concrete
      information gaps while preserving disagreement about efficacy versus scaling.
    completion_signals:
      - strongest supported case and strongest unresolved objections are both represented
      - dossier and review claims are traced to sources rather than inherited as authoritative
      - evidence strength, transfer assumptions, and implementation uncertainty are separated
      - disagreement is preserved rather than averaged away
      - information gaps are concrete and testable
      - claims requiring human verification are explicit
      - no lifecycle status, priority, or accepted classification is changed
    human_verification_required: true
    decision_authority: none
    entrypoint: https://github.com/Svyable/human-kind/issues/37

  - id: HK-0029-scout-evidence-map
    status: open-issue
    role: scout
    target_idea: HK-0029
    target_path: ideas/poverty-and-economic-mobility/HK-0029-test-flexible-snap-interviews-to-reduce-procedural-denials-while
    contribution_type: structured-review
    objective: >
      Build the bounded evidence map called for by HK-0029, separating evidence on
      access and participation from payment accuracy, program integrity,
      administrative burden, privacy, accessibility, and transferability across
      state and staffing contexts.
    completion_signals:
      - primary or authoritative sources are preferred and factual claims are traceable
      - randomized access effects are separated from transfer assumptions
      - payment accuracy and program-integrity outcomes are treated separately from access
      - counterevidence, null findings, missing outcomes, and implementation constraints are explicit
      - claims requiring human verification are explicit
      - no lifecycle status, priority, or accepted classification is changed
    human_verification_required: true
    decision_authority: none
    task_issue: https://github.com/Svyable/human-kind/issues/46
    entrypoint: https://github.com/Svyable/human-kind/issues/46
