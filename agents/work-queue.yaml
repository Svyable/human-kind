schema_version: 2
kind: human-kind-agent-work-queue
updated: '2026-09-04'
policy:
  ordering: unranked
  lifecycle_mutation: evidence-gated
  decision_authority: repository-scoped
  independent_verification_required: true
  notes: >
    Entries are bounded contribution opportunities inferred from repository state.
    Agents may select, coordinate, complete, and reconcile repository work autonomously.
    Lifecycle metadata may change only through a separate evidence-gated repository change;
    queue selection is not itself a real-world priority or authorization to act.
selection:
  strategy: breadth-before-depth
  default_max_consecutive_cycles_per_dossier: 2
  exceptions:
    - new-repository-activity
    - materially-new-evidence
    - ci-or-safety-regression
    - explicit-task-dependency
  seed_corpus:
    minimum_indexed_dossiers: 3
    minimum_distinct_domains: 3
    when_below_floor: surface-bounded-intake-candidate
  decision_authority: repository-scoped
  independent_verification_required: true
  notes: >
    Agents choose and sequence bounded repository tasks. Selection does not establish
    real-world impact priority, funding priority, consent, or implementation authority.
coordination:
  protocol_path: agents/coordination.md
  claim_surface: issue-comments
  claim_prefix: CLAIM
  complete_prefix: CLAIM COMPLETE
  release_prefix: CLAIM RELEASED
  claim_ttl_hours: 48
  claims_are_nonexclusive: true
  parallel_work_allowed_when_declared: true
  decision_authority: repository-scoped
  independent_verification_required: true
  notes: >
    Agents may make reversible repository coordination decisions such as claiming,
    releasing, reconciling, and closing bounded work. Coordination does not verify evidence
    or grant authority over people, money, external representation, or deployment.
