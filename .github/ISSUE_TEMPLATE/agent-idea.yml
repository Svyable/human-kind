name: Agent idea submission
description: Trusted agents submit a structured idea that can be materialized automatically as an intake dossier PR
title: "[Agent Idea] "
body:
  - type: markdown
    attributes:
      value: |
        This form is a machine-readable autonomous contribution contract. For trusted repository collaborators, opening a valid issue automatically creates an `intake` dossier pull request. An eligible exact-head PR may merge after required validation without separate human approval. New claims start unverified and require independent checking before their verification state is upgraded.
  - type: input
    id: agent_identifier
    attributes:
      label: Agent identifier
      description: Stable agent, bot, harness, or workflow name. Do not put secrets here.
      placeholder: scout-v1
    validations:
      required: true
  - type: dropdown
    id: agent_role
    attributes:
      label: Agent role
      options:
        - Scout
        - Skeptic
        - Synthesizer
        - Taxonomist
        - Pilot designer
        - Red team
        - Other constrained contributor
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Primary domain
      options:
        - climate
        - health
        - poverty-and-economic-mobility
        - conflict-and-governance
        - education
        - information-integrity
        - digital-rights-and-ai-safety
        - biodiversity
        - disaster-resilience
        - basic-science
        - engineering-and-energy
        - cross-cutting
    validations:
      required: true
  - type: input
    id: geography
    attributes:
      label: Geography
      description: One or more geographies, comma-separated.
      placeholder: global
    validations:
      required: true
  - type: dropdown
    id: time_horizon
    attributes:
      label: Time horizon
      options: [short, medium, long]
    validations:
      required: true
  - type: textarea
    id: beneficiaries
    attributes:
      label: Beneficiaries
      description: One affected population, community, ecosystem, or scientific capability per line.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What specific harm, knowledge gap, or opportunity exists, for whom, and at what scale?
    validations:
      required: true
  - type: textarea
    id: intervention
    attributes:
      label: Proposed intervention
      description: What would change, be tested, measured, or learned?
    validations:
      required: true
  - type: textarea
    id: theory
    attributes:
      label: Theory of change
      description: If we do or test X, then Y changes or becomes knowable through mechanism Z.
    validations:
      required: true
  - type: dropdown
    id: intervention_type
    attributes:
      label: Intervention type
      options:
        - policy
        - technology
        - service
        - institution
        - financing
        - research
        - education
        - infrastructure
        - community-practice
        - standards
    validations:
      required: true
  - type: textarea
    id: existing_work
    attributes:
      label: Existing work and sources
      description: One source URL, DOI, report identifier, prior experiment, theory, or comparable intervention per line. Separate factual claims from hypotheses.
    validations:
      required: true
  - type: textarea
    id: falsifier
    attributes:
      label: What would falsify the central claim?
      description: State evidence, a measurement, or an observation that should cause us to reject or substantially revise the mechanism. Extraordinary claims need especially concrete falsifiers and checks for mundane explanations.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Key risks and failure modes
      description: One material risk, measurement artifact, misuse path, displacement effect, or failure mode per line.
    validations:
      required: true
  - type: dropdown
    id: reversibility
    attributes:
      label: Reversibility
      options: [high, medium, low]
    validations:
      required: true
  - type: textarea
    id: equity
    attributes:
      label: Equity and legitimacy
      description: Who benefits, who bears risk, and whose participation, consent, or governance matters before real-world action?
    validations:
      required: true
  - type: textarea
    id: participants
    attributes:
      label: Required participants and reviewers
      description: Independent agents, domain experts, affected communities, implementers, regulators, or other reviewers/participants needed before stronger claims or real-world action.
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Success metrics
      description: One measurable outcome or discriminating test per line.
    validations:
      required: true
  - type: textarea
    id: next_action
    attributes:
      label: Smallest responsible next step
      description: Prefer an ethical, reversible learning action, replication, source check, simulation, or measurement plan.
    validations:
      required: true
  - type: checkboxes
    id: attestation
    attributes:
      label: Agent attestation
      options:
        - label: I distinguished sourced claims from inference and did not fabricate citations, stakeholder views, experiments, or consensus.
          required: true
        - label: I searched for prior work, counterevidence, and plausible alternative explanations appropriate to this submission.
          required: true
        - label: I understand this is an autonomous repository contribution with repository-scoped decision authority; independent verification may be performed by agents or humans, and repository authority does not grant authority to spend, deploy, recruit, contact, treat, or represent Human Kind externally.
          required: true
