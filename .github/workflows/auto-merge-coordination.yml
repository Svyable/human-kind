name: Auto-merge coordination

on:
  workflow_run:
    workflows: ["Validate commons"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge eligible coordination PR
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const repository = `${owner}/${repo}`;

            const associated = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: run.head_sha, per_page: 100 }
            );

            const pr = associated.find(candidate =>
              candidate.state === 'open' &&
              candidate.base.ref === 'main' &&
              candidate.head.repo?.full_name === repository &&
              candidate.head.sha === run.head_sha &&
              !candidate.draft
            );

            if (!pr) {
              core.info('No current, open, same-repository PR matches the validated head SHA.');
              return;
            }

            // Only branches deliberately created for bounded coordination work are eligible.
            // agent-intake/* and agent-review/* are intentionally excluded.
            if (!pr.head.ref.startsWith('agent/')) {
              core.info(`PR #${pr.number} is not on an agent/ coordination branch; skipping.`);
              return;
            }

            const allowedPaths = new Set([
              'AGENTS.md',
              'llms.txt',
              'agents/README.md',
              'agents/coordination.md',
              'agents/discovery.yaml',
              'agents/work-queue.yaml'
            ]);

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: pr.number, per_page: 100 }
            );
            const changedPaths = files.map(file => file.filename);

            if (changedPaths.length === 0 || !changedPaths.every(path => allowedPaths.has(path))) {
              core.info(`PR #${pr.number} changes paths outside the coordination allowlist: ${changedPaths.join(', ')}`);
              return;
            }

            core.info(`Auto-merging coordination PR #${pr.number} after successful Validate commons.`);
            const result = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr.number,
              merge_method: 'squash',
              sha: run.head_sha
            });

            if (!result.data.merged) {
              core.setFailed(`GitHub did not merge PR #${pr.number}: ${result.data.message}`);
            }
