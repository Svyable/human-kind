name: Auto-merge validated agent PRs

on:
  workflow_run:
    workflows: ["Validate commons"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge eligible validated agent PR
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const repository = `${owner}/${repo}`;

            const associated = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: run.head_sha, per_page: 100 }
            );

            const pr = associated.find(candidate =>
              candidate.state === 'open' &&
              candidate.base.ref === 'main' &&
              candidate.head.repo?.full_name === repository &&
              candidate.head.sha === run.head_sha &&
              !candidate.draft
            );

            if (!pr) {
              core.info('No current, open, same-repository PR matches the validated head SHA.');
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: pr.number, per_page: 100 }
            );
            const paths = files.map(file => file.filename);

            const coordinationPaths = new Set([
              'AGENTS.md',
              'llms.txt',
              'agents/README.md',
              'agents/coordination.md',
              'agents/discovery.yaml',
              'agents/work-queue.yaml'
            ]);

            function coordinationEligible() {
              return pr.head.ref.startsWith('agent/') &&
                paths.length > 0 &&
                paths.every(path => coordinationPaths.has(path));
            }

            function intakeEligible() {
              if (!/^agent-intake\/issue-\d+$/.test(pr.head.ref)) return false;

              const fragmentFiles = files.filter(file => /^data\/idea-index\.d\/HK-\d{4}\.yaml$/.test(file.filename));
              if (fragmentFiles.length !== 1 || fragmentFiles[0].status !== 'added') return false;
              const fragmentId = fragmentFiles[0].filename.match(/(HK-\d{4})\.yaml$/)?.[1];

              const dossierFiles = files.filter(file => file !== fragmentFiles[0]);
              if (dossierFiles.length < 5) return false;
              const allowedNames = new Set([
                'README.md',
                'evidence.md',
                'idea.yaml',
                'proposal.md',
                'risks.md',
                'updates.md'
              ]);
              const roots = new Set();
              const ids = new Set();
              for (const file of dossierFiles) {
                const match = file.filename.match(/^(ideas\/[^/]+\/(HK-\d{4})-[^/]+)\/([^/]+)$/);
                if (!match || !allowedNames.has(match[3]) || file.status !== 'added') return false;
                roots.add(match[1]);
                ids.add(match[2]);
              }
              return roots.size === 1 && ids.size === 1 && ids.has(fragmentId) &&
                dossierFiles.some(file => file.filename.endsWith('/idea.yaml'));
            }

            function reviewEligible() {
              if (!/^agent-review\/issue-\d+$/.test(pr.head.ref)) return false;
              if (files.length !== 2) return false;

              const roots = new Set();
              const extensions = new Set();
              for (const file of files) {
                const match = file.filename.match(/^(ideas\/[^/]+\/HK-\d{4}-[^/]+)\/reviews\/[^/]+\.(md|yaml)$/);
                if (!match || file.status !== 'added') return false;
                roots.add(match[1]);
                extensions.add(match[2]);
              }
              return roots.size === 1 && extensions.has('md') && extensions.has('yaml');
            }

            const lane = coordinationEligible()
              ? 'coordination'
              : intakeEligible()
                ? 'intake'
                : reviewEligible()
                  ? 'review'
                  : null;

            if (!lane) {
              core.info(`PR #${pr.number} is outside unattended agent path/branch scopes: ${paths.join(', ')}`);
              return;
            }

            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number: pr.number, per_page: 100 }
            );
            const latestByUser = new Map();
            for (const review of reviews) latestByUser.set(review.user?.login, review.state);
            if ([...latestByUser.values()].includes('CHANGES_REQUESTED')) {
              core.info(`PR #${pr.number} has an outstanding changes-requested review; skipping.`);
              return;
            }

            const refreshed = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
            if (
              refreshed.data.state !== 'open' ||
              refreshed.data.draft ||
              refreshed.data.head.sha !== run.head_sha ||
              refreshed.data.base.ref !== 'main'
            ) {
              core.info(`PR #${pr.number} moved after validation; skipping stale merge.`);
              return;
            }

            core.info(`Auto-merging validated ${lane} PR #${pr.number}.`);
            const result = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr.number,
              merge_method: 'squash',
              sha: run.head_sha
            });

            if (!result.data.merged) {
              core.setFailed(`GitHub did not merge PR #${pr.number}: ${result.data.message}`);
            }
