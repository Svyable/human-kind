name: Validate commons

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema
      - name: Run agent harness regression suite
        run: python scripts/test_agent_harness.py
      - name: Validate machine-readable agent work queue
        run: python scripts/validate_agent_work_queue.py
      - name: Validate dossiers, structured reviews, review freshness, and local links
        run: python scripts/validate_ideas.py
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-path .git --exclude "^mailto:" "**/*.md"
          fail: true
