name: Agent idea intake

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-idea-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      startsWith(github.event.issue.title, '[Agent Idea]') &&
      (github.event.issue.author_association == 'OWNER' ||
       github.event.issue.author_association == 'MEMBER' ||
       github.event.issue.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Materialize issue as dossier
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_ACTOR: ${{ github.event.issue.user.login }}
          ISSUE_UPDATED_AT: ${{ github.event.issue.updated_at }}
        run: python scripts/agent_issue_to_dossier.py

      - name: Write conflict-resistant idea-index fragment
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python scripts/index_intake_fragment.py
          git checkout -- data/idea-index.yaml

      - name: Validate generated dossier and index fragment
        run: |
          python scripts/validate_ideas.py
          python scripts/validate_idea_index_fragments.py

      - name: Commit generated intake branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          branch="agent-intake/issue-${ISSUE_NUMBER}"
          git config user.name "human-kind-agent-intake[bot]"
          git config user.email "human-kind-agent-intake[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add ideas data/idea-index.d
          git commit -m "Materialize agent idea #${ISSUE_NUMBER}"
          git push --force-with-lease origin "$branch"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Open or reuse dossier pull request
        id: pr
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          clean_title="${ISSUE_TITLE#\[Agent Idea\] }"
          url=$(gh pr list --base main --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [[ -z "$url" ]]; then
            body=$(cat <<EOF
          ## Agent-generated intake dossier

          Source issue: #${ISSUE_NUMBER}

          This PR was materialized automatically from a trusted agent submission. It remains at **intake** status.

          - Human verification before consequential use: **required**
          - Claims requiring verification: **yes**
          - Decision authority: **none**
          - A successful repository validation may merge this bounded intake artifact automatically; merge does not verify its claims, prioritize it, or change lifecycle status.

          Closes #${ISSUE_NUMBER}
          EOF
            )
            url=$(gh pr create --base main --head "$BRANCH" --title "[Agent intake] ${clean_title}" --body "$body")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Link PR from source issue
        if: steps.pr.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "🤖 Intake dossier PR ready: ${PR_URL}. Repository validation may merge this bounded artifact automatically; human verification remains required before its claims are treated as verified or used for lifecycle decisions."

      - name: Report repository PR-permission blocker
        if: steps.pr.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH_URL: https://github.com/${{ github.repository }}/tree/agent-intake/issue-${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "The dossier validated and its intake branch was pushed. GitHub Actions could not open the PR because the repository-level PR-creation toggle is disabled. A maintainer can open a PR from ${BRANCH_URL}, or enable **Settings → Actions → General → Workflow permissions → Allow GitHub Actions to create and approve pull requests** and then close/reopen this Issue. Run: ${RUN_URL}"

      - name: Explain earlier materialization failure
        if: failure() && steps.pr.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Agent intake could not be materialized. Review the validation output, correct the Issue if needed, then close and reopen it to retry: ${RUN_URL}"

  untrusted:
    if: >-
      startsWith(github.event.issue.title, '[Agent Idea]') &&
      github.event.issue.author_association != 'OWNER' &&
      github.event.issue.author_association != 'MEMBER' &&
      github.event.issue.author_association != 'COLLABORATOR'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Explain trust boundary
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Thanks for the agent submission. Automatic PR materialization is limited to trusted repository collaborators so public Issues cannot obtain a write-capable automation path. A maintainer can review and resubmit or promote this intake manually."
