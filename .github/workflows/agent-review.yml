name: Agent dossier review

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      startsWith(github.event.issue.title, '[Agent Review]') &&
      (github.event.issue.author_association == 'OWNER' ||
       github.event.issue.author_association == 'MEMBER' ||
       github.event.issue.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Materialize structured review
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_UPDATED_AT: ${{ github.event.issue.updated_at }}
        run: python scripts/agent_review_to_artifact.py

      - name: Validate repository
        run: python scripts/validate_ideas.py

      - name: Commit review branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          branch="agent-review/issue-${ISSUE_NUMBER}"
          git config user.name "human-kind-agent-review[bot]"
          git config user.email "human-kind-agent-review[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add ideas
          git commit -m "Materialize agent review #${ISSUE_NUMBER}"
          git push --force-with-lease origin "$branch"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Open or reuse review pull request
        id: pr
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          clean_title="${ISSUE_TITLE#\[Agent Review\] }"
          url=$(gh pr list --base main --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [[ -z "$url" ]]; then
            body=$(cat <<EOF
          ## Agent-produced dossier review

          Source issue: #${ISSUE_NUMBER}

          This PR adds a structured review artifact to an existing dossier.

          - Human verification before consequential use: **required**
          - Claims requiring verification: **yes**
          - Decision authority: **repository-scoped**
          - Repository-scoped authority permits this bounded artifact to merge through the authorized unattended lane after exact-head validation.
          - Merge accepts the review into the version-controlled commons; it does **not** verify claims, change dossier lifecycle status, or authorize external/consequential action.

          Closes #${ISSUE_NUMBER}
          EOF
            )
            url=$(gh pr create --base main --head "$BRANCH" --title "[Agent review] ${clean_title}" --body "$body")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Link PR from source issue
        if: steps.pr.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "🔎 Structured review PR ready: ${PR_URL}. Repository-scoped agent authority permits eligible exact-head validated merge; human verification remains required before claims are treated as verified, and review merge does not change dossier status."

      - name: Report repository PR-permission blocker
        if: steps.pr.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH_URL: https://github.com/${{ github.repository }}/tree/agent-review/issue-${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "The review validated and its branch was pushed. GitHub Actions could not open the PR because the repository-level PR-creation toggle is disabled. A maintainer can open a PR from ${BRANCH_URL}, or enable **Settings → Actions → General → Workflow permissions → Allow GitHub Actions to create and approve pull requests** and then close/reopen this Issue. Run: ${RUN_URL}"

      - name: Explain earlier materialization failure
        if: failure() && steps.pr.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Agent review could not be materialized. Review the validation output, correct the Issue if needed, then close and reopen it to retry: ${RUN_URL}"

  untrusted:
    if: >-
      startsWith(github.event.issue.title, '[Agent Review]') &&
      github.event.issue.author_association != 'OWNER' &&
      github.event.issue.author_association != 'MEMBER' &&
      github.event.issue.author_association != 'COLLABORATOR'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Explain trust boundary
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Thanks for the agent review. Automatic PR materialization is limited to trusted repository collaborators so public Issues cannot obtain a write-capable automation path. A maintainer or trusted repository agent can inspect and promote useful analysis through an authorized lane."
