name: Agent dossier review

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      startsWith(github.event.issue.title, '[Agent Review]') &&
      (github.event.issue.author_association == 'OWNER' ||
       github.event.issue.author_association == 'MEMBER' ||
       github.event.issue.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Materialize structured review
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_UPDATED_AT: ${{ github.event.issue.updated_at }}
        run: python scripts/agent_review_to_artifact.py

      - name: Validate repository
        run: python scripts/validate_ideas.py

      - name: Commit review branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          branch="agent-review/issue-${ISSUE_NUMBER}"
          git config user.name "human-kind-agent-review[bot]"
          git config user.email "human-kind-agent-review[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add ideas
          git commit -m "Materialize agent review #${ISSUE_NUMBER}"
          git push --force-with-lease origin "$branch"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Open or reuse review pull request
        id: pr
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          clean_title="${ISSUE_TITLE#\[Agent Review\] }"
          url=$(gh pr list --base main --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [[ -z "$url" ]]; then
            body=$(cat <<EOF
          ## Agent-produced dossier review

          Source issue: #${ISSUE_NUMBER}

          This PR adds a structured autonomous review artifact to an existing dossier.

          - Verification status: **unverified**
          - Independent review requirement: **required before verification upgrade**
          - Claims requiring verification: **yes**
          - Decision authority: **repository-scoped**
          - An eligible exact-head review PR may merge autonomously after required validation.
          - Merge preserves the review in the commons; it does **not** establish empirical truth or grant real-world authority.

          Closes #${ISSUE_NUMBER}
          EOF
            )
            url=$(gh pr create --base main --head "$BRANCH" --title "[Agent review] ${clean_title}" --body "$body")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Link PR from source issue
        if: steps.pr.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "🔎 Structured review PR ready: ${PR_URL}. It may merge autonomously after exact-head validation. Its claims remain unverified until independently checked; a later evidence-gated repository PR may update dossier status when warranted."

      - name: Report repository PR-permission blocker
        if: steps.pr.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH_URL: https://github.com/${{ github.repository }}/tree/agent-review/issue-${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "The review validated and its branch was pushed. GitHub Actions could not open the PR because the repository-level PR-creation toggle is disabled. A repository administrator can open a PR from ${BRANCH_URL}, or enable **Settings → Actions → General → Workflow permissions → Allow GitHub Actions to create and approve pull requests** and then close/reopen this Issue. Run: ${RUN_URL}"

      - name: Explain earlier materialization failure
        if: failure() && steps.pr.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Agent review could not be materialized. Review the validation output, correct the Issue if needed, then close and reopen it to retry: ${RUN_URL}"

  untrusted:
    if: >-
      startsWith(github.event.issue.title, '[Agent Review]') &&
      github.event.issue.author_association != 'OWNER' &&
      github.event.issue.author_association != 'MEMBER' &&
      github.event.issue.author_association != 'COLLABORATOR'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Explain trust boundary
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Thanks for the agent review. Automatic PR materialization is limited to trusted repository collaborators so public Issues cannot become an unauthenticated write path. An autonomous trusted repository agent can inspect and preserve useful analysis through an authorized lane."
